<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiyarTV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2937;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #3b82f6;
            letter-spacing: 1px;
        }

        .status-badge {
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 12px;
            background: #1e293b;
            color: #94a3b8;
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        /* Player Alanı */
        .player-section {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* Kanal Listesi Yan Menü */
        .channel-sidebar {
            width: 320px;
            background: #111827;
            border-left: 1px solid #1f2937;
            overflow-y: auto;
            padding: 15px;
        }

        .channel-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            margin-bottom: 8px;
            background: #1f2937;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .channel-card:hover, .channel-card:focus, .channel-card.active {
            background: #2563eb;
            border-color: #60a5fa;
            outline: none;
        }

        .channel-card img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            background: #fff;
            padding: 2px;
            border-radius: 6px;
        }

        .channel-name {
            font-size: 15px;
            font-weight: 500;
        }

        /* Yükleniyor Uyarısı */
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(13, 15, 18, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #1e293b;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">DiyarTV</div>
        <div class="status-badge" id="statusBadge">Kanallar Yükleniyor...</div>
    </header>

    <div class="main-container">
        <!-- Video Oynatıcı -->
        <div class="player-section">
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <div id="loadingText">Güncel kanal listesi çekiliyor...</div>
            </div>
            <video id="videoPlayer" controls autoplay></video>
        </div>

        <!-- Kanal Yan Menüsü -->
        <div class="channel-sidebar" id="channelList">
            <!-- Kanallar Dinamik Eklenecek -->
        </div>
    </div>

    <!-- Yerel Yedek Liste -->
    <script src="channels.js"></script>

    <script>
        // Entegre Edilen GitHub Raw Bağlantısı
        const REMOTE_JSON_URL = "https://raw.githubusercontent.com/diyarr65/DiyarTV./refs/heads/main/channels.json";

        const video = document.getElementById('videoPlayer');
        const channelListContainer = document.getElementById('channelList');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const statusBadge = document.getElementById('statusBadge');
        let hls = null;

        document.addEventListener("DOMContentLoaded", () => {
            loadChannels();
        });

        async function loadChannels() {
            let channels = [];
            
            try {
                // Önbellek kalmaması için zaman damgası ekliyoruz
                const cacheBusterUrl = REMOTE_JSON_URL + "?t=" + new Date().getTime();
                const response = await fetch(cacheBusterUrl);
                
                if (!response.ok) throw new Error("Sunucu yanıt vermedi");
                
                channels = await response.json();
                statusBadge.innerText = "Bulut Listesi Aktif (Güncel)";
                statusBadge.style.color = "#4ade80";
            } catch (error) {
                console.warn("Uzaktan kanal listesi çekilemedi, yerel yedek deneniyor:", error);
                
                if (window.channelData && window.channelData.length > 0) {
                    channels = window.channelData;
                    statusBadge.innerText = "Yerel Yedek Liste Aktif";
                    statusBadge.style.color = "#facc15";
                } else {
                    document.getElementById('loadingText').innerText = "Kanal listesi yüklenemedi!";
                    return;
                }
            }

            renderChannels(channels);
            loadingOverlay.style.display = 'none';

            if (channels.length > 0) {
                playChannel(channels[0].url, channels[0].name);
            }
        }

        function renderChannels(channels) {
            channelListContainer.innerHTML = '';

            channels.forEach((channel, index) => {
                const card = document.createElement('div');
                card.className = 'channel-card' + (index === 0 ? ' active' : '');
                card.tabIndex = 0; // TV Kumandası odaklanması için
                
                card.innerHTML = `
                    <img src="${channel.logo}" alt="${channel.name}" onerror="this.src='https://via.placeholder.com/40?text=TV'">
                    <span class="channel-name">${channel.name}</span>
                `;

                card.addEventListener('click', () => {
                    document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    playChannel(channel.url, channel.name);
                });

                card.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        card.click();
                    }
                });

                channelListContainer.appendChild(card);
            });
        }

        function playChannel(url, name) {
            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Otomatik oynatma engellendi:", e));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.play();
            }
        }
    </script>
</body>
</html>
