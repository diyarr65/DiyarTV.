name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK Kurulumu
        uses: android-actions/setup-android@v3

      - name: Cordova ile HTML'i APK'ya Dönüştür
        run: |
          npm install -g cordova
          cordova create build_app com.diyartv.app DiyarTV
          cd build_app
          cordova platform add android
          rm -rf www/*
          cp ../index.html ../channels.js ../channels.json www/ 2>/dev/null || cp ../index.html www/
          cordova build android

      - name: APK Dosyasini Indirilebilir Yap (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: DiyarTV-APK
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
